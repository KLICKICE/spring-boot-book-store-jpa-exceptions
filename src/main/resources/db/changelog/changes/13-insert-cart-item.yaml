databaseChangeLog:
  - changeSet:
      id: insert-sample-cart-item
      author: KLICKICE
      changes:
        - insert:
            tableName: cart_items
            columns:
              - column:
                  name: shopping_cart_id
                  valueComputed: "(SELECT user_id FROM shopping_carts WHERE user_id=(SELECT id FROM users WHERE email='john@example.com'))"
              - column:
                  name: book_id
                  valueNumeric: 1
              - column:
                  name: quantity
                  valueNumeric: 2

        - insert:
            tableName: cart_items
            columns:
              - column:
                  name: shopping_cart_id
                  valueComputed: "(SELECT user_id FROM shopping_carts WHERE user_id=(SELECT id FROM users WHERE email='mary@example.com'))"
              - column:
                  name: book_id
                  valueNumeric: 2
              - column:
                  name: quantity
                  valueNumeric: 1
